name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build
        run: dotnet build -c Release

      - name: Package
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          ZIP_NAME="Wholphin-Companion_${VERSION}.zip"
          zip -r "$ZIP_NAME" "bin/Release/net9.0/Wholphin Companion"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ env.ZIP_NAME }}

      - name: Update manifest from release asset
        run: |
          VERSION="${{ env.VERSION }}"
          ZIP_NAME="${{ env.ZIP_NAME }}"
          SOURCE_URL="https://github.com/sysmoon14/Wholphin-Companion/releases/download/v${VERSION}/${ZIP_NAME}"

          for i in 1 2 3 4 5; do
            curl -L -o "$ZIP_NAME" "$SOURCE_URL" && break
            sleep 2
          done
          CHECKSUM="$(md5sum "$ZIP_NAME" | awk '{print $1}')"
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CHANGELOG="$(printf '%s' "${{ github.event.release.body }}" | sed 's/\r//g')"
          bash ./tools/update-manifest.sh "$VERSION" "$CHECKSUM" "$TIMESTAMP" "$CHANGELOG"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add manifest.json
          git commit -m "Update manifest for v${VERSION}" || true
          git push origin HEAD:main || true
